# AIJiaoxue CI pipeline
# - lint: ESLint static check (single job)
# - test: npm ci + init-db smoke + node:test serial suite
#   across Ubuntu/Windows x Node 22/24 matrix
#   (each test case builds/destroys its own temp database and runs serially,
#    verifying the better-sqlite3 stability fix does not regress cross-platform)
#
# NOTE: Windows 作业固定使用 windows-2022（预装 VS2022 + C++ 负载）。
# windows-latest 已迁移到 Server 2025 / VS2026，node-gyp v11 无法识别，
# 会导致 better-sqlite3 源码编译失败（"Could not find any Visual Studio"）。
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # better-sqlite3 优先使用官方预编译二进制；预编译不可用时才回退源码编译。
      # 显式声明环境变量，避免某些 runner 镜像误配置导致跳过 prebuild-install。
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_build_from_source: false

      - name: Init database smoke check
        run: npm run init-db

      - name: Run tests (serial, 69 cases)
        run: npm test

  e2e:
    name: E2E (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_build_from_source: false

      # Playwright 浏览器二进制不随 npm install 一起安装
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests (14 cases)
        run: npm run test:e2e